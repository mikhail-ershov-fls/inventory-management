<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Apply the saved/system theme before first paint so dark mode never flashes light.
       Must stay in sync with STORAGE_KEY in src/composables/useTheme.js. -->
  <script>
    (function () {
      var theme = null
      try { theme = localStorage.getItem('app-theme') } catch (e) {}
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    })()
  </script>
  <title>Factory Inventory Management System</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
